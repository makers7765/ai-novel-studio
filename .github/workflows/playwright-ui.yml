name: Playwright UI Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check JavaScript syntax
        run: node --check public/app.js && node --check functions/api/generate.js && node --experimental-default-type=module --test functions/api/generate.test.mjs
      - name: Start local static preview
        run: python3 -m http.server 4173 --directory public > /tmp/novel-studio-preview.log 2>&1 &
      - name: Run safe UI checks
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 npx playwright test
      - name: Upload test report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
